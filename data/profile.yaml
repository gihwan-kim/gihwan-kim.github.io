intro: |
  I am a Researcher at [ETRI](https://www.etri.re.kr/eng/main/main.etri), working on
  on-device and physical AI. My current focus is making vision-language-action (VLA) and
  vision-language-navigation (VLN) models light enough to run on humanoid robots, together
  with the orchestration that keeps perception, reasoning, and control within a real robot's
  compute and latency budget.

  Before ETRI, I completed my M.S. in Computer System and Software at Chungnam National
  University, advised by Hyungshin Kim in ESLAB, where I worked on model compression and
  acceleration — post-training quantization for vision transformers
  ([WACV 2026](https://openaccess.thecvf.com/content/WACV2026/papers/Kim_IPTQ-ViT_Post-Training_Quantization_of_Non-linear_Functions_for_Integer-only_Vision_Transformers_WACV_2026_paper.pdf),
  [ECCV 2024 Workshop](https://link.springer.com/chapter/10.1007/978-3-031-91979-4_10))
  and lightweight segmentation and detection for satellite and UAV imagery. I was also a
  visiting scholar at Carnegie Mellon University.
